# BLACKGATE flag SUBMISSION site: validates flags and keeps score for all 6 stages.
# Holds only hashed flags. Standalone: no challenge files, no links to other sites.
services:
  submission:
    build: .
    container_name: blackgate-submission
    ports: ["${SUBMISSION_PORT:-8090}:8090"]
    environment:
      - SECRET_KEY=${SECRET_KEY:?copy .env.example to .env and fill it in}
      - PYTHONDONTWRITEBYTECODE=1
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    restart: unless-stopped
