# BLACKGATE challenge portal: briefings and downloadable evidence for stages 1-6.
# Stateless. No flags, no scores, no connection to the submission site or the box.
services:
  portal:
    build: .
    container_name: blackgate-portal
    ports: ["${PORTAL_PORT:-8080}:8080"]
    environment:
      - SUBMIT_URL=${SUBMIT_URL:-}
      - BOX_URL=${BOX_URL:-}
      - PYTHONDONTWRITEBYTECODE=1
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    restart: unless-stopped
